# requirements.windows.lock — the pinned closure for the WINDOWS installer
# build (.github/workflows/windows-installer.yml → build_installer.py).
#
# WHY THIS FILE EXISTS (V0.6.66, the second "doesn't open" field report):
#   The Windows workflow used to install requirements.txt UNPINNED, so every
#   installer build rode whatever versions pip resolved that morning. The
#   V0.6.65 installer (built 2026-10-24) silently picked up PySide6 6.12.0 +
#   mammoth 1.13.0 + markitdown 0.1.9 — the EXACT combination that
#   deterministically SEGFAULTED the test suite on Linux (documented in
#   NEW_SESSION_PROMPT's recovery recipe: the lock-alignment incident).
#   The clean CI runner happened to tolerate that stack (launch tests
#   green), but the first real consumer machine did not: "installed …
#   doesn't open at all", silently. Same hazard as the Linux incident,
#   one platform over.
#
# WHAT IS PINNED HERE:
#   Everything pip resolved on the 2026-10-24 windows-latest runner EXCEPT
#   the documented-dangerous packages, which are downgraded to the
#   globally verified versions (the same ones requirements.lock proves on
#   Linux — suite 8,613/16/25 at V0.6.65):
#     PySide6 / PySide6_Addons / PySide6_Essentials / shiboken6  6.12.0 → 6.11.2
#     mammoth                                                     1.13.0 → 1.11.0
#     markitdown                                                  0.1.9  → 0.1.7
#   Three transitive pins follow the markitdown 0.1.7 downgrade (its
#   dependency set differs from 0.1.9's — the first CI attempt hit
#   ResolutionImpossible on exactly these):
#     magika  1.0.3 → 0.6.3  (markitdown 0.1.7 wants ~=0.6.1; mirrors
#                             requirements.lock)
#     onnxruntime 1.31.0 → 1.20.1  (magika 0.6.3's sys_platform=='win32'
#                             marker caps onnxruntime<=1.20.1 — THIS is the
#                             real origin of the old "lock is unsolvable on
#                             Windows" note; on Linux the cap doesn't apply
#                             so requirements.lock keeps 1.30.0)
#     youtube-transcript-api 1.2.4 → 1.0.3  (markitdown 0.1.7 wants ~=1.0.0;
#                             mirrors requirements.lock)
#   (PySide6_Pdf / PySide6_WebEngine are NOT pinned: they are transitive
#   deps of PySide6_Addons==6.11.2 and resolve with it.)
#
# REGENERATION RULE (keep it verbatim in future regenerations):
#   1. `pip install -r requirements.txt` on windows-latest, capture the
#      "Successfully installed …" line.
#   2. Pin that resolved set HERE.
#   3. Downgrade the three documented-dangerous pins to the verified
#      versions above (update them only when a NEW verified baseline
#      exists on BOTH platforms).
#   4. The packed selftest + launch test in build_installer.py is the
#      gate that proves the chosen set actually starts on Windows.
#
# NOTE: pyinstaller is NOT pinned here (it is build tooling, not app
# runtime); the workflow pins it separately (pyinstaller==6.22.3 — the
# version that built the verified V0.6.65 bundle).

