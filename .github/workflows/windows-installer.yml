name: windows-installer

# V0.6.63: the Elixir Windows installer pipeline.
# workflow_dispatch = on-demand builds (used while iterating);
# tag pushes (v*) = release builds. Artifacts: the installer exe, the
# selftest reports, and the startup-time report.

on:
  workflow_dispatch:
  push:
    tags: ["V*"]  # repo tag convention is uppercase (V0.6.62)

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest pytest-cov pytest-asyncio hypothesis

      - name: Changed-area sanity tests (the modules touched by the installer work)
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q --no-cov -p no:cacheprovider
          tests/test_bootstrap.py
          tests/test_p2_llm_model_singletons.py
          tests/test_v182037_audit_fixes.py
          tests/test_v182039_audit_fixes.py
          tests/test_v1820411_p4_rebrand.py

      - name: Build + test the installer (pack, selftest, launch, Inno, silent install)
        run: python build_installer.py

      - name: Startup timing + import profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_installer | Out-Null
          .\installer\measure_startup.ps1 -Exe "python" -ExeArgs "main.py" -Label "source (python main.py)" -OutFile "dist_installer\startup_report.txt"
          .\installer\measure_startup.ps1 -Exe "dist_app\Elixir\Elixir.exe" -Label "packed app (onedir)" -OutFile "dist_installer\startup_report.txt" -Append
          python installer\importtime_top.py | Tee-Object -FilePath "dist_installer\startup_report.txt" -Append

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elixir-windows-installer
          path: |
            dist_installer/*
            selftest_report*.txt
          if-no-files-found: warn
