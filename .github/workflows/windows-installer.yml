# Elixir — Windows Installer builder
#
# Runs build_installer.py on a real Windows runner: PyInstaller (onedir) →
# self-test → launch test → Inno Setup installer → silent install test →
# startup-time measurement. The resulting dist_installer/Elixir-Setup-<v>.exe
# is uploaded as a workflow artifact and attached to a GitHub Release.
#
# Trigger manually (Actions → Windows Installer → Run workflow), or push to
# the installer-build branch.

name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [installer-build]
    tags: ["V*"]  # repo tag convention is uppercase (V0.6.62)

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Elixir-Setup-<version>.exe
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # UTF-8 stdout/stderr even on the cp1252 console (Windows runner)
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # V0.6.66: the Windows build installs the PINNED closure from
      # requirements.windows.lock (generated from the 2026-10-24 runner
      # resolution with the three documented-dangerous packages
      # downgraded to the globally verified versions — PySide6 6.11.2 /
      # mammoth 1.11.0 / markitdown 0.1.7). The V0.6.65 installer rode
      # the unpinned requirements.txt and silently picked up PySide6
      # 6.12.0 + mammoth 1.13.0 + markitdown 0.1.9 — the exact
      # combination documented to SEGFAULT on Linux — and the first
      # real consumer machine then hit "installed … doesn't open at
      # all". Never float the Windows build again; the lock file's
      # header documents the regeneration rule. (The old note about
      # magika/onnxruntime making the Linux requirements.lock
      # unsolvable on Windows is obsolete: today's resolution shows
      # magika 1.0.3 + onnxruntime 1.31.0 coexist fine, and the
      # windows lock pins exactly that green set.)
      # bash (not pwsh) so a failing pip line actually fails the step.
      - name: Install dependencies (pinned windows lock + PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.windows.lock
          pip install pyinstaller==6.22.3

      - name: Cache downloaded external tools (ffmpeg / poppler)
        uses: actions/cache@v4
        with:
          path: build_pyinstaller/downloads
          key: bundled-tools-${{ hashFiles('build_installer.py') }}

      - name: Build installer + run all tests
        run: python build_installer.py

      - name: Upload installer + reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elixir-windows-installer
          path: |
            dist_installer/*.exe
            build_installer.log
            selftest_report.txt
            build_pyinstaller/selftest_*.txt
            build_pyinstaller/importtime.log
          if-no-files-found: warn
          retention-days: 30

      - name: Attach the installer to a GitHub Release
        # 2026-10-23 guard: a workflow_dispatch run at an existing VERSION
        # falls into the `gh release upload --clobber` fallback and would
        # REPLACE the verified release asset (caught live — the dispatched
        # run was cancelled mid-build). Dispatch runs build + test + upload
        # artifacts only; tag pushes (the designed release path) attach as
        # before.
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $exe = Get-ChildItem "dist_installer/Elixir-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          $tag = "V$version-windows"
          $size = [math]::Round($exe.Length / 1MB, 1)
          $notes = @"
          Elixir $version — Windows installer.

          Download **$($exe.Name)** ($size MB), double-click to install, then launch
          **Elixir** from the Start menu or the desktop icon.

          What's inside: the whole app (onedir PyInstaller bundle), ffmpeg and
          Poppler (bundled — the app finds them automatically), and an app icon.
          What's NOT inside: model weights, Ollama (install from ollama.com when
          prompted) and API keys.

          The installer was verified automatically on a clean Windows machine:
          self-test, launch test and silent install/uninstall test all passed.
          Startup-time numbers and the top-5 slowest imports are in the build
          log (build_installer.log in the workflow artifacts).
          "@
          # create the release (or upload to it if it already exists)
          gh release create $tag "$($exe.FullName)" --title "Elixir $version — Windows Installer" --notes $notes 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag "$($exe.FullName)" --clobber
          }
