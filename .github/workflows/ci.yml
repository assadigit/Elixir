# Elixir — CI Pipeline
# V18.10 (Phase 6.7): GitHub Actions matrix — ruff + mypy + pytest --cov-fail-under=30
# V0.13 (Phase 0 / Green Gates): first fully-green configuration.
#   - ruff PINNED (was a floating >=0.4.0 — every run got a different linter,
#     and newer ruff rules broke the gate; the pinned version matches
#     .pre-commit-config.yaml exactly).
#   - test job installs the (now-repaired) core requirements + pytest tools.
#     The old requirements.txt could not resolve at all (malformed misaki
#     pin + phantom anydoc + unsatisfiable kokoro>=0.9.0) — the job died at
#     "Install dependencies" on every run.
#   - pytest invoked via `python -m pytest` (no repo-root conftest.py —
#     plain `pytest` does not put the repo root on sys.path, so `import core`
#     would fail).
#
# This workflow gates releases on:
# - ruff lint clean (pinned version)
# - ruff format clean
# - pytest passing with coverage >= 30%
#
# The golden-master audit gate (--audit) is NOT in CI because it requires
# the z-ai-web-dev-sdk + bun runtime. Run it manually before releases:
#   pytest --audit --audit-summary=path/to/summary.md --audit-source=path/to/source.md

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.8"  # V0.13: PINNED — keep in sync with .pre-commit-config.yaml

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-requests

      - name: Run mypy (warn-only)
        run: mypy core/ utils/ --ignore-missing-imports || true
        continue-on-error: true

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ \
            --cov=core \
            --cov=utils \
            --cov-fail-under=30 \
            --cov-report=term-missing \
            --cov-report=xml \
            -p no:cacheprovider

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
