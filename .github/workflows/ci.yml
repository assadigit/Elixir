# Elixir — CI Pipeline
# V18.10 (Phase 6.7): GitHub Actions matrix — ruff + mypy + pytest --cov-fail-under=30
# V0.13 (Phase 0 / Green Gates): first fully-green configuration.
#   - ruff PINNED (was a floating >=0.4.0 — every run got a different linter,
#     and newer ruff rules broke the gate; the pinned version matches
#     .pre-commit-config.yaml exactly).
#   - test job installs the (now-repaired) core requirements + pytest tools.
#     The old requirements.txt could not resolve at all (malformed misaki
#     pin + phantom anydoc + unsatisfiable kokoro>=0.9.0) — the job died at
#     "Install dependencies" on every run.
#   - pytest invoked via `python -m pytest` (no repo-root conftest.py —
#     plain `pytest` does not put the repo root on sys.path, so `import core`
#     would fail).
#
# V0.14 (Phase 1 / Baselines & Measurement):
#   - coverage gate raised 30% → 50% — the HONEST floor. CI-measured baseline
#     is 50.68% (35,540 stmts, 17,530 missed, run 35458197259). The roadmap's
#     aspirational 55% gate would have been red on day one — a gate above the
#     measured value is not a gate, it's a broken build. Phase 2's per-package
#     ≥80% push will raise the global number; the gate ratchets then.
#   - coverage.xml + htmlcov/ uploaded as a CI artifact on every run.
#   - NEW audit job: pip-audit (PINNED 2.10.1) over requirements.lock,
#     REPORT-ONLY (vulns never fail the build — the gate activates in
#     Phase 3 after waivers exist). First run of this job already caught a
#     real finding: the lock had leaked a GitHub token via a `-e git+…`
#     editable line (fixed in V0.14; token rotation advised).
#
# V0.15 (Phase 2 / Test-Net Deepening):
#   - test job installs hypothesis (the property suites
#     tests/test_property_*.py — 124 tests — need it).
#   - global coverage gate ratcheted 50% → 63% (CI-measured post-Phase-2:
#     64.05% on the clean env — 1pp margin for env-dependent optional-dep
#     skips; local dev env measures 64.3%).
#   - NEW per-package gates (roadmap Phase 2 acceptance): core/llm,
#     core/pdf, core/summarisation each enforced ≥80% via
#     `coverage report --fail-under=80` on the same .coverage data.
#     Post-Phase-2 measured: llm 96% / pdf 98% / summarisation 91%.
#
# V0.17 (Phase 4 / Accuracy & Reliability Harness):
#   - NEW accuracy eval gate step in the test job (after pytest):
#     `scripts/eval_summary.py --check` re-runs the deterministic pipeline
#     over the 6 golden chapters and fails on quality regressions vs the
#     committed baseline (tests/golden/eval_baseline.json) — ROUGE-L,
#     faithfulness, hallucination-rate, coverage, length policy, verdict
#     (per-chapter scorecards uploaded as an artifact every run).
#   - The roadmap planned "warn on PR, fail on release tag"; since every
#     push to main runs CI here, the gate FAILS on main pushes. The metrics
#     are fully deterministic (mock LLM), so a trip is always a real change.
#
# This workflow gates releases on:
# - ruff lint clean (pinned version)
# - ruff format clean
# - pytest passing with coverage >= 63% (global) and >= 80% on the three
#   core packages (llm / pdf / summarisation)
# - pip-audit report produced (report-only)
#
# The golden-master audit gate (--audit) is NOT in CI because it requires
# the z-ai-web-dev-sdk + bun runtime. Run it manually before releases:
#   pytest --audit --audit-summary=path/to/summary.md --audit-source=path/to/source.md

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.16.8"  # V0.13: PINNED — keep in sync with .pre-commit-config.yaml

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-requests

      - name: Run mypy (warn-only)
        run: mypy core/ utils/ --ignore-missing-imports || true
        continue-on-error: true

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (poppler)
        # V0.15: the app REQUIRES Poppler at launch (verify_environment.py —
        # pdf2image rasterization for the OCR pipeline); CI must test the
        # documented configuration, and the pdf real-render tests exercise it.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # pymupdf is TEST-ONLY (V0.15): the pdf suites build real in-memory
          # PDFs with fitz to exercise the real extraction code. The app keeps
          # it optional — requirements.txt is intentionally unchanged.
          pip install pytest pytest-cov pytest-asyncio "hypothesis>=6.100.0" "pymupdf>=1.24.0"

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ \
            --cov=core \
            --cov=utils \
            --cov-fail-under=63 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -p no:cacheprovider

      # V0.15 (Phase 2.1 acceptance): per-package ≥80% gates on the three
      # core packages — the Phase 5 de-monolithization safety net. These run
      # on the SAME .coverage data produced above, so no re-execution cost.
      - name: Per-package coverage gates (llm / pdf / summarisation >= 80%)
        run: |
          python -m coverage report --include="core/llm/*" --fail-under=80
          python -m coverage report --include="core/pdf/*" --fail-under=80
          python -m coverage report --include="core/summarisation/*" --fail-under=80

      # V0.17 (Phase 4.3): the ACCURACY GATE — deterministic quality
      # scorecards over the golden chapters, regressed against the committed
      # baseline. Runs AFTER pytest (the suite already proves the pipeline
      # reproduces the frozen fixtures; this proves the QUALITY of those
      # outputs did not regress). Mutation-validated by
      # tests/test_p4_eval_gate.py (degraded output + prompt-bank change
      # are both caught).
      - name: Accuracy eval gate (Phase 4)
        run: python scripts/eval_summary.py --check --json eval_scorecards.json

      # V0.17 (Phase 4 acceptance): per-chapter hallucination-rate +
      # faithfulness (+ ROUGE-L, coverage, length policy, verdict) attached
      # to every CI run.
      - name: Upload eval scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-scorecards
          path: eval_scorecards.json
          if-no-files-found: warn

      # V0.14 (Phase 1.1): publish the coverage artifact — the per-file
      # htmlcov tree + the XML report are attached to every CI run so a
      # coverage drop can be diagnosed without re-running locally.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # V0.14 (Phase 1.5): dependency vulnerability audit job.
  # V0.16 (Phase 3 / task 3.5): FAIL GATE ACTIVE — see the comment above
  # the audit job definition.
  # Audits the exact pinned closure in requirements.lock (--no-deps: no
  # resolution drift, no build isolation, fast).
  #
  # V0.16 (Phase 3 / task 3.5): the FAIL GATE IS LIVE. pip-audit exits
  # non-zero on any known vulnerability in the locked core set that is
  # not on the waiver list — a superset of the roadmap's "fail on
  # high-severity" criterion (any high-severity finding necessarily
  # fails). Waivers are one OSV/GHSA ID per line in
  # requirements.audit-waivers (comments with #) — each waiver MUST
  # carry a justification comment and an expiry review date, per the
  # roadmap's "documented waivers" acceptance.
  audit:
    name: Dependency Audit (pip-audit, gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install "pip-audit==2.10.1"  # PINNED — same policy as ruff

      - name: Audit pinned core closure (gate + report)
        run: |
          set -euo pipefail
          # Build the --ignore-vuln args from the committed waiver list.
          WAIVER_ARGS=()
          while IFS= read -r line; do
            line="${line%%#*}"                # strip trailing comments
            line="$(echo "$line" | xargs)"    # trim whitespace
            if [ -n "$line" ]; then
              echo "::notice title=Audit waiver::Ignoring ${line} (see requirements.audit-waivers for justification)"
              WAIVER_ARGS+=(--ignore-vuln "$line")
            fi
          done < requirements.audit-waivers
          # GATED RUN: exit code propagates (non-zero = known vuln not waived).
          # The JSON report is produced even when the gate trips.
          set +e
          pip-audit -r requirements.lock \
            --no-deps \
            --format=json \
            -o pip-audit-report.json \
            --progress-spinner off \
            "${WAIVER_ARGS[@]}"
          ec=$?
          set -e
          if [ $ec -ne 0 ]; then
            echo "::error title=Dependency audit FAILED::pip-audit exit $ec — known vulnerabilities in requirements.lock that are not waived (see the pip-audit-report artifact). Fix by upgrading the pinned package or documenting a waiver in requirements.audit-waivers."
          fi
          exit $ec

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn
