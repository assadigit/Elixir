# Elixir — CI Pipeline
# V18.10 (Phase 6.7): GitHub Actions matrix — ruff + mypy + pytest --cov-fail-under=30
#
# This workflow runs on every push/PR to main. It gates releases on:
# - ruff lint clean
# - mypy type-check clean (warn-only for now — too many existing errors)
# - pytest passing with coverage >= 30%
#
# The golden-master audit gate (--audit) is NOT in CI because it requires
# the z-ai-web-dev-sdk + bun runtime. Run it manually before releases:
#   pytest --audit --audit-summary=path/to/summary.md --audit-source=path/to/source.md

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Run ruff check
        run: ruff check --output-format=github .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy + stubs
        run: pip install mypy types-requests

      - name: Run mypy (warn-only)
        run: mypy core/ utils/ --ignore-missing-imports || true
        continue-on-error: true

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=core \
            --cov=utils \
            --cov-fail-under=30 \
            --cov-report=term-missing \
            --cov-report=xml \
            -p no:cacheprovider

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
