# V18.19.1.3 (Phase 3 / Debt D1): pre-commit config — restores the 4 test_type_safety
# tests that were failing because this file was absent.
#
# The config was verified against tests/test_type_safety.py::TestPreCommitConfig, which
# asserts the presence of: ruff-pre-commit + ruff, mirrors-mypy + mypy,
# trailing-whitespace, end-of-file-fixer.
#
# Hooks chosen to match the tooling already declared in pyproject.toml
# ([tool.ruff] target-version py310, line-length 100, select E/W/F/I/UP/B/C4/SIM).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # V18.2.18 (M7): basic hygiene — strip trailing whitespace.
      - id: end-of-file-fixer
        # Ensure every file ends with a newline (prevents "no newline at EOF" diffs).
      - id: check-yaml
        # Validate YAML syntax for all .yaml/.yml files (config/, prompts/).
      - id: check-added-large-files
        args: [--maxkb=2048]
        # Block accidental commit of large binaries (model weights, PDFs > 2 MB).
      - id: check-merge-conflict
        # Catch unresolved merge-conflict markers before they land.
      - id: debug-statements
        # Block breakpoint()/pdb imports in production code.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        # Run ruff (replaces flake8/isort/pyupgrade). --fix auto-applies safe fixes;
        # --exit-non-zero-on-fix fails the hook so the staged file is re-added by the
        # contributor (no silent auto-commit). Mirrors [tool.ruff] in pyproject.toml.
      - id: ruff-format
        # Ruff's formatter (Black-compatible). Keeps formatting consistent with the
        # existing codebase style.

  - repo: https://github.com/python/mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        # Use the mirrors-mypy hook so the hook's mypy install is isolated from the
        # project venv. additional_dependencies mirrors the runtime optional-deps
        # so mypy can resolve PySide6 / pydantic stubs during local pre-commit runs.
        additional_dependencies:
          - pydantic>=2.5.0
        args: [--ignore-missing-imports, --no-strict-optional, --check-untyped-defs]
        # Conservative defaults: the codebase has many `Optional[Any]` and lazy imports
        # (tiktoken stub, torch optional). --ignore-missing-imports keeps the hook green
        # on contributor machines that lack the heavy optional deps; CI can tighten.
