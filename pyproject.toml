[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixir"
# V18.3 (Phase 1.4): version is dynamic — read from the VERSION file.
# This makes VERSION the single source of truth (was stale at 18.2.21).
dynamic = ["version"]
description = "Elixir — PDF to Markdown with AI summarization"
# V18.3 (Phase 1.5): tighten to >=3.12,<3.13 (PySide6 not yet confirmed for 3.13).
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# V18.2.21 (Phase 1.2/1.4): runtime deps that were previously only in
# requirements.txt. Declaring them here lets `uv lock` capture them in
# uv.lock for reproducible installs. Pydantic is used by structured_io.py
# (optional — degrades to manual validation when absent). Tenacity is used
# by retry.py (optional — degrades to linear retry when absent).
dependencies = [
    "PySide6>=6.6.0",
    "pypdf>=4.3.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    "markitdown[all]>=0.1.0",
    "pytesseract>=0.3.10",
    "wordninja>=1.0.0",
    "tiktoken>=0.7.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
    "Pillow>=10.4.0",
    "PyYAML>=6.0.1",
    "rapidfuzz>=3.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    # V0.14 (Phase 1.5): dependency-vuln reporting (report-only in CI).
    # Pinned in CI at 2.10.1; floor here keeps local/CI parity.
    "pip-audit>=2.10.0",
    # V0.15 (Phase 2.2): property-based suites (tests/test_property_*.py).
    "hypothesis>=6.100.0",
    # V0.15 (Phase 2): random-order determinism smoke (`pytest -p randomly`).
    "pytest-randomly>=3.15.0",
    # V0.15 (Phase 2.1): TEST-ONLY — the pdf suites build real in-memory
    # PDFs with PyMuPDF to exercise the real extraction code. The APP keeps
    # fitz optional (guarded imports, graceful degradation — see
    # dependency_checker); requirements.txt is intentionally unchanged.
    "pymupdf>=1.24.0",
]
# V18.2.21 (Phase 1.4): Retry consolidation — optional runtime dep used by
# core/llm/retry.py. If absent, retry.py degrades to a 2-attempt LINEAR retry
# with a WARNING logged at import. See requirements.txt for install notes.
retry = ["tenacity>=8.2.0"]
# V18.2.21 (Phase 1.2): Structured output — optional runtime dep used by
# core/llm/structured_io.py. If absent, validation degrades to a manual
# shape check. Pydantic v2 is the 2026 standard.
structured = ["pydantic>=2.5.0"]

# ── V0.13 (Phase 0 / Green Gates): optional feature groups ────────────────
# These were previously unversioned/unsatisfiable entries in requirements.txt
# (see the V0.13 audit, docs/AUDIT_SWOT_V0.11.md W2/W4). Floors corrected:
# kokoro/misaki max on PyPI is 0.7.x — the old >=0.9.0 pins could never resolve.
tts = [
    "kokoro>=0.7.0",        # English TTS engine
    "huggingface_hub>=0.23.0",  # Piper voice downloads (core/tts/voices.py)
    "misaki[en]>=0.7.0",    # Kokoro's English phonemizer frontend
    "soundfile>=0.12.0",    # writes Kokoro's numpy output to .wav
    "piper-tts>=1.4.0",     # Farsi TTS (ONNX models)
    "pydub>=0.25.1",        # audio segment stitching
    "scipy>=1.11.0",        # VibeVoice 24kHz→48kHz upsampling
]
grounding = [
    # Layer-8 anti-hallucination: langextract verbatim grounding.
    "langextract>=1.0.0",
]
formats = [
    "ebooklib>=0.18",       # EPUB input
    "beautifulsoup4>=4.12", # HTML/EPUB parsing
    "genanki>=0.13",        # direct Anki .apkg export
    "docling>=2.0",         # technical PDF extraction (tables + code blocks)
    "pikepdf>=8.0",         # PDF repair for the AnyDoc engine
]
rag = [
    "chromadb>=0.5.0",              # local vector database for RAG
    "sentence-transformers>=2.7.0", # embedding model
    "spacy>=3.7.0",                 # advanced NER
    "langchain>=0.2.0",             # LLM orchestration framework
    "langchain-community>=0.2.0",   # LangChain community integrations (Ollama)
]
# Convenience extra that pulls everything.
full = ["elixir[retry,structured,tts,grounding,formats,rag]"]

# V0.13 (Phase 0): read version from the VERSION file (single source of truth).
[tool.setuptools.dynamic]
version = {file = "VERSION"}

# V0.13 (Phase 0): explicit package discovery. Flat-layout auto-discovery
# fails with multiple top-level dirs ("Multiple top-level packages discovered
# in a flat-layout: ['core', 'ui_qt', 'assets', 'config', 'prompts', …]"),
# which broke `pip install -e .` and the Makefile `install` target.
[tool.setuptools]
py-modules = ["controller"]
[tool.setuptools.packages.find]
include = ["core*", "ui_qt*", "utils*"]

[tool.ruff]
# V18.20.3.12: py310 → py312 — the codebase uses 3.12-only f-string syntax and the rig runs 3.12.14 (the stale py310 target made ruff flag valid code as syntax errors)
target-version = "py312"
line-length = 100
extend-exclude = ["test_data", "assets", "__pycache__"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
# V0.13 (Phase 0 lint triage): the previous gate was aspirational — CI lint
# had never been green. As of V0.13 every rule NOT listed below is ENFORCED
# and clean (including all F-class dead-code rules, B-class bug-pattern
# rules, and import sorting). The rules below are deliberately disabled
# with rationale, to be ratcheted back per-file in later phases (see the
# parking lot in docs/ROADMAP_V0.12.md).
ignore = [
    "E501",   # line length — pre-existing V18.x decision
    "B008",   # pre-existing V18.x decision
    "SIM108", # pre-existing V18.x decision
    "E402",   # ~200 sites: deliberate late/conditional imports (env setup before
              # imports in main.py; lazy Qt imports in dialogs). Re-enable
              # per-file during Phase 5 de-monolithization.
    "E701",   # ~150 sites: legacy one-line `if x: y` statements — mechanical
    "E702",   #   reformat pass, deferred (no behavior value, large diff)
    "SIM105", # ~50 sites: try/except/pass → contextlib.suppress — deferred
    "SIM103", # ~20 sites: needless-bool return rewrite — deferred
    "SIM102", # ~20 sites: collapsible nested-if — deferred
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-export facades (P2 hygiene commit)
"ui_qt/**/*.py" = ["E402"]  # kept for the future E402 ratchet re-enable
# Tests: 59k LOC of characterization tests — style-only classes are exempt
# (their value is behavior-pinning, not style). Real defect classes (F, B)
# stay enforced.
"tests/**" = ["E741", "E701", "E702", "C401", "C408", "C416", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# P0 fix: was "3.10" while runtime/AST is 3.12 — the 3.10 target crashes
# mypy on numpy>=2.2 stubs (make typecheck broken). Align with requires-python.
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
# V18.2.18 (B3): Tightened — disallow bare `Any` in generics + flag
# unreachable code. The ConversionContext Protocol (core/pipeline/
# conversion_context.py) is the typed replacement for `converter: Any`
# in phase modules. Full migration is gradual (see conversion_context.py).
disallow_any_generics = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = "test_data/|assets/|scripts/diagnostic\\.py"

[[tool.mypy.overrides]]
module = "PySide6.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pdfplumber.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rapidfuzz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tiktoken.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "markitdown.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wordninja.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# V0.15 (Phase 2.5): `-p no:randomly` keeps the DEFAULT run order
# deterministic (CI reproducibility). pytest-randomly auto-activates once
# installed, and its per-test reseed crashes through thinc's
# `pytest_randomly.random_seeder` entry point on numpy>=2
# (`numpy.random.seed(seed)` with seed ≥ 2**32 → ValueError).
# Random-order determinism smoke (roadmap Phase 2 acceptance) re-enables it
# explicitly WITHOUT the reseed:
#   python3 -m pytest tests/ -p randomly --randomly-dont-reset-seed \
#       --randomly-seed=<N> --no-cov -q
addopts = [
    "-ra",
    "--strict-markers",
    "-p no:randomly",
    "--cov=core",
    "--cov=utils",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
# V18.15.4.3: register markers so `--strict-markers` doesn't reject them.
# Enables `pytest -m "not slow"`, `pytest -m integration`, etc. without code changes.
markers = [
    "integration: multi-module flow tests (slower, may touch filesystem)",
    "slow: tests that take >2s on a warm machine",
    "regression: version-anchored regression tests (test_v18_*_*.py)",
    "characterization: byte-for-byte stability gates for extracted modules",
    "gpu: tests requiring a real GPU (currently none — all mocked)",
]

[tool.coverage.run]
source = ["core", "utils"]
omit = ["*/test_data/*", "*/assets/*", "*/scripts/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", 'if __name__ == .__main__.:', "if TYPE_CHECKING:"]
